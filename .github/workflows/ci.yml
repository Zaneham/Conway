name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install NASM
      run: sudo apt-get update && sudo apt-get install -y nasm

    - name: Build
      run: make linux

    - name: Run hello example
      run: ./bin/conway examples/hello.elf

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: conway-linux
        path: bin/conway

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install NASM
      run: choco install nasm -y

    - name: Add NASM to PATH
      run: echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

    - name: Build
      run: .\build.bat

    - name: Run hello example
      run: .\bin\conway.exe examples\hello.elf

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: conway-windows
        path: bin/conway.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Download Linux binary
      uses: actions/download-artifact@v4
      with:
        name: conway-linux
        path: ./linux

    - name: Download Windows binary
      uses: actions/download-artifact@v4
      with:
        name: conway-windows
        path: ./windows

    - name: Create release artifacts
      run: |
        chmod +x ./linux/conway
        zip -j conway-windows.zip ./windows/conway.exe
        tar -czvf conway-linux.tar.gz -C ./linux conway
